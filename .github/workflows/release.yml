name: "Create Release"

# Fallback path: builds and publishes a release for a manually pushed tag.
# The primary, fully automated path is release-orchestration.yml.
#
# The tag must match the version in manifest.json and be listed in
# versions.json - this is validated before publishing.

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: "Build and publish release"
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ github.ref_name }}
